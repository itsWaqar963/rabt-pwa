<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark slate background -->
    <rect id="bg" width="512" height="512" rx="112" fill="#0d1117"/>

    <!-- Emerald radial aura -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="oklch(0.76 0.15 164)" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="oklch(0.76 0.15 164)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="oklch(0.76 0.15 164)" stop-opacity="0"/>
    </radialGradient>

    <!-- White text glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle emerald ring glow -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0d1117"/>

  <!-- Very subtle dark gradient overlay for depth -->
  <rect width="512" height="512" rx="112"
    fill="url(#aura)"/>

  <!-- Emerald glow ring -->
  <circle cx="256" cy="256" r="148"
    fill="none"
    stroke="oklch(0.76 0.15 164)"
    stroke-width="1.5"
    stroke-opacity="0.35"
    filter="url(#ringGlow)"/>

  <!-- Arabic wordmark 1(7  white with glow -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    font-family="'Geeza Pro', 'Noto Naskh Arabic', 'Iowan Old Style', Georgia, serif"
    font-size="188"
    font-weight="700"
    fill="#ffffff"
    filter="url(#glow)"
    direction="rtl"
    unicode-bidi="bidi-override"
  >1(7</text>
</svg>
